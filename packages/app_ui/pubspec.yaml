name: app_ui
description: App UI Package of the Moovz Dash game.
version: 0.1.0+1
publish_to: none

environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: 3.44.8

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 700
    - family: MoovzIcons
      fonts:
        - asset: assets/fonts/MoovzIcons.ttf
  assets:
    - assets/logos/moovz_branco.svg
    - assets/logos/m_moovz.svg
