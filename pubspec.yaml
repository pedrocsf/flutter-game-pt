name: moovz_dash
description: Moovz Dash, um jogo de plataforma com tema de treino.
version: 1.0.0+16
publish_to: none

environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: 3.44.8

dependencies:
  app_ui:
    path: packages/app_ui
  audioplayers: ^6.8.1
  bloc: ^9.2.1
  equatable: ^3.0.0
  file_selector: ^1.1.0
  flame: ^1.38.2
  flame_behaviors: ^1.4.0
  flame_tiled: ^1.21.2
  flow_builder: ^0.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  intl: ^0.20.2
  leaderboard_repository:
    path: packages/leaderboard_repository
  leap:
    git:
      url: https://github.com/VeryGoodOpenSource/leap.git
      ref: vgv
      path: packages/leap
  logging: ^1.3.0
  ordered_set: ^8.0.1
  path: ^1.8.3
  pathxp: ^0.4.0
  provider: ^6.1.5
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  bloc_test: ^10.0.0
  flame_test: ^2.3.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/map/
    - assets/map/anim/
    - assets/map/anim/avatar/
    - assets/map/tiles/
    - assets/map/objects/
    - assets/map/procedural/
    - assets/music/
    - assets/sfx/

flutter_launcher_icons:
  android: true
  adaptive_icon_foreground: "./android_icon.png"
  adaptive_icon_background: "#F85F00"
  min_sdk_android: 26
  image_path: './android_icon.png'
  ios: 'ios_icon.png'
  remove_alpha_ios: true
  web:
    generate: true
    image_path: 'android_icon.png'
    background_color: '#1A1A1A'
    theme_color: '#F85F00'
  windows:
    generate: true
    image_path: 'android_icon.png'
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: 'android_icon.png'
